services:
  postgres:
    image: postgres:16-alpine
    container_name: jarvis_kpi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-corporativo_db}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-jarvis_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-troque_esta_senha}
      POSTGRES_READONLY_USER: ${POSTGRES_READONLY_USER:-jarvis_readonly}
      POSTGRES_READONLY_PASSWORD: ${POSTGRES_READONLY_PASSWORD:-troque_esta_senha_ro}
    ports:
      - "5432:5432"
    volumes:
      - jarvis_pgdata:/var/lib/postgresql/data
      - ./docker/init_readonly.sh:/docker-entrypoint-initdb.d/01_init_readonly.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-jarvis_admin} -d ${POSTGRES_DB:-corporativo_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  jarvis_pgdata:
